name: Sync cover to My Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout my repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone source repo
        run: |
          set -e
          SRC_DIR="/tmp/cover-src"
          rm -rf "$SRC_DIR"
          git clone --depth 1 https://github.com/aghabanafshi-alt56/cover.git "$SRC_DIR"

      - name: Copy files (excluding .git and .github)
        run: |
          set -e

          # حذف .git مخزن مبدأ (حیاتی برای push)
          rm -rf /tmp/cover-src/.git

          # حذف .github مخزن مبدأ تا با ورک‌فلوی خودت تداخل نکند
          rm -rf /tmp/cover-src/.github

          # پاک‌سازی محتوای پروژه به جز .git و .github
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +

          # کپی همه‌ی محتوا
          cp -r /tmp/cover-src/. .

          # نمایش وضعیت
          git status --short | head -30

      - name: Configure git
        run: |
          git config user.name  "aghabanafshi[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit & Push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "چیزی برای کامیت نیست."
          else
            git commit -m "FunkLand"
            git push
          fi
